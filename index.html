<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafc">
    <title>Speed Building Test — Coding Decoding</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --green: #10b981;
            --green-light: #ecfdf5;
            --red: #ef4444;
            --red-light: #fef2f2;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-main);
            color: var(--text-dark);
            min-height: 100dvh;
            font-size: 15px;
            line-height: 1.5;
            overflow-x: hidden;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
        }
        .hidden { display: none !important; }

        /* MODE SELECTION SCREEN */
        .start-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        .start-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 36px 28px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .brand-logo-img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin: 0 auto 16px;
            display: block;
            border-radius: 16px;
        }
        .start-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        .start-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }
        .mode-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            padding: 16px;
            background: #fff;
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            text-align: left;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        .mode-btn:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        .mode-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .mode-icon.quiz { background: #dbeafe; color: #2563eb; }
        .mode-icon.test { background: #d1fae5; color: #059669; }
        .mode-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 2px;
        }
        .mode-info-txt {
            font-size: 12px;
            color: var(--text-muted);
        }
        .mode-arrow {
            margin-left: auto;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* MAIN APP */
        .quiz-app {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .quiz-header {
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 18px;
        }
        .quiz-header-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .hdr-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .hdr-logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 8px;
        }
        .hdr-brand-title {
            font-weight: 700;
            font-size: 15px;
            color: var(--text-dark);
        }
        .hdr-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #fff;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            transition: all 0.15s;
        }
        .hdr-btn:hover { background: var(--bg-main); }
        .hdr-timer {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-family: monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
        }

        /* QUESTIONS CONTAINER */
        .quiz-main {
            flex: 1;
            overflow-y: auto;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 16px;
        }
        .q-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }
        .q-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .q-num-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .lang-btn {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .q-text {
            font-size: 16px;
            line-height: 1.6;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 22px;
            white-space: pre-line;
        }
        .opts {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }
        .opt {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: #fff;
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .opt:hover:not(.locked) {
            border-color: var(--primary);
            background: #f8fafc;
        }
        .opt.selected {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .opt.correct {
            border-color: var(--green);
            background: var(--green-light);
        }
        .opt.wrong {
            border-color: var(--red);
            background: var(--red-light);
        }
        .opt.locked { cursor: default; }
        .opt-letter {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #fff;
            border: 1.5px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .opt.selected .opt-letter {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        .opt.correct .opt-letter {
            background: var(--green);
            border-color: var(--green);
            color: #fff;
        }
        .opt.wrong .opt-letter {
            background: var(--red);
            border-color: var(--red);
            color: #fff;
        }
        .opt-text {
            flex: 1;
            font-size: 15px;
            font-weight: 600;
        }
        .opt-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .opt.correct .opt-tag { background: var(--green); color: #fff; }
        .opt.wrong .opt-tag { background: var(--red); color: #fff; }

        .sol-box {
            margin-top: 20px;
            padding: 16px;
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            border-radius: 12px;
        }
        .sol-head {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sol-content {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-dark);
        }

        /* BOTTOM NAV */
        .quiz-nav {
            flex-shrink: 0;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
            padding: 12px 18px;
        }
        .quiz-nav-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.15s ease;
        }
        .nav-btn.prev {
            background: #fff;
            border: 1px solid var(--border-color);
            color: var(--text-dark);
        }
        .nav-btn.prev:disabled { opacity: 0.4; cursor: not-allowed; }
        .nav-btn.submit {
            background: var(--green-light);
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .nav-btn.next {
            background: var(--primary);
            color: #ffffff;
        }
        .nav-btn.next:hover { background: var(--primary-hover); }

        /* PALETTE MODAL */
        .palette-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 150;
            display: none;
        }
        .palette-overlay.open { display: block; }
        .palette-drawer {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: min(340px, 85vw);
            background: #ffffff;
            z-index: 160;
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            box-shadow: var(--shadow-lg);
        }
        .palette-drawer.open { transform: translateX(0); }
        .pal-head {
            padding: 18px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
            font-size: 17px;
        }
        .pal-grid {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            align-content: start;
        }
        .pal-btn {
            aspect-ratio: 1;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }
        .pal-btn:hover { transform: scale(1.05); }
        .pal-btn.answered { background: var(--green); color: #fff; border-color: var(--green); }
        .pal-btn.current { outline: 2px solid var(--primary); outline-offset: 2px; }

        /* SUBMIT MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 170;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 20px;
            padding: 28px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
        .modal-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 22px;
        }
        .modal-stat {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid var(--border-color);
        }
        .modal-stat-num { font-size: 24px; font-weight: 800; color: var(--text-dark); }
        .modal-stat-label { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 4px; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .modal-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
        }
        .modal-btn.confirm { background: var(--primary); color: #fff; }
        .modal-btn.cancel { background: #f1f5f9; color: var(--text-dark); }

        /* RESULTS SCREEN */
        .results-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            z-index: 180;
            display: none;
            overflow-y: auto;
            padding: 30px 16px 60px;
        }
        .results-screen.open { display: block; }
        .results-box {
            max-width: 600px;
            margin: 0 auto;
        }
        .res-hero { text-align: center; margin-bottom: 24px; }
        .res-hero h2 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
        .res-score-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #fff;
            border-radius: 20px;
            padding: 28px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
        }
        .res-score-val { font-size: 54px; font-weight: 800; line-height: 1; margin-bottom: 6px; }
        .res-score-val span { font-size: 22px; opacity: 0.6; }
        .res-score-lbl { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.8; }
        .res-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .res-item {
            background: #fff;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .res-item-val { font-size: 22px; font-weight: 700; }
        .res-item-lbl { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 4px; }
        .res-actions { display: flex; flex-direction: column; gap: 10px; }
        .res-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
        }
        .res-btn.primary { background: var(--primary); color: #fff; }

        /* TOAST */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: #0f172a;
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 300;
            opacity: 0;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-lg);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- START / MODE SELECT -->
    <div class="start-screen" id="startScreen">
        <div class="start-card">
            <img src="logo.png" alt="Quiz Logo" class="brand-logo-img" onerror="this.style.display='none'">
            <h1 class="start-title">Coding Decoding Practice</h1>
            <p class="start-desc">Speed Building Test — Choose your mode to begin.</p>
            
            <button class="mode-btn" onclick="startApp('quiz')">
                <div class="mode-icon quiz"><i class="fas fa-bolt"></i></div>
                <div>
                    <div class="mode-name">Practice Mode</div>
                    <div class="mode-info-txt">Instant answer & detailed solution after each question.</div>
                </div>
                <i class="fas fa-arrow-right mode-arrow"></i>
            </button>

            <button class="mode-btn" onclick="startApp('test')">
                <div class="mode-icon test"><i class="fas fa-clock"></i></div>
                <div>
                    <div class="mode-name">Exam Mode</div>
                    <div class="mode-info-txt">Test environment. View complete result at the end.</div>
                </div>
                <i class="fas fa-arrow-right mode-arrow"></i>
            </button>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div class="quiz-app hidden" id="quizApp">
        <header class="quiz-header">
            <div class="quiz-header-inner">
                <button class="hdr-btn" onclick="openPalette()"><i class="fas fa-th-large"></i></button>
                <div class="hdr-brand">
                    <img src="logo.png" alt="Logo" class="hdr-logo-img" onerror="this.style.display='none'">
                    <span class="hdr-brand-title">Reasoning Quiz</span>
                </div>
                <div class="hdr-timer">
                    <i class="fas fa-stopwatch"></i>
                    <span id="timerText">00:00</span>
                </div>
            </div>
        </header>

        <main class="quiz-main" id="quizMain"></main>

        <nav class="quiz-nav" id="quizNav">
            <div class="quiz-nav-inner">
                <button class="nav-btn prev" id="prevBtn" onclick="prevQuestion()">
                    <i class="fas fa-arrow-left"></i> Previous
                </button>
                <button class="nav-btn submit" onclick="openSubmitModal()">
                    <i class="fas fa-paper-plane"></i> Submit
                </button>
                <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()">
                    <span id="nextLabel">Next</span> <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </nav>
    </div>

    <!-- QUESTION PALETTE -->
    <div class="palette-overlay" id="paletteOverlay" onclick="closePalette()"></div>
    <aside class="palette-drawer" id="paletteDrawer">
        <div class="pal-head">
            <span>Questions</span>
            <button onclick="closePalette()"><i class="fas fa-times"></i></button>
        </div>
        <div class="pal-grid" id="paletteGrid"></div>
    </aside>

    <!-- SUBMIT CONFIRMATION MODAL -->
    <div class="modal-overlay" id="submitModal">
        <div class="modal-box">
            <h3 class="modal-title">Submit Test?</h3>
            <div class="modal-stats-grid">
                <div class="modal-stat">
                    <div class="modal-stat-num" id="modalAttempted" style="color:var(--green)">0</div>
                    <div class="modal-stat-label">Attempted</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-num" id="modalUnattempted" style="color:var(--text-muted)">0</div>
                    <div class="modal-stat-label">Unattempted</div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn confirm" onclick="confirmSubmit()">Yes, Finish Test</button>
                <button class="modal-btn cancel" onclick="closeSubmitModal()">Resume Test</button>
            </div>
        </div>
    </div>

    <!-- FINAL RESULTS SCREEN -->
    <div class="results-screen" id="resultsScreen">
        <div class="results-box" id="resultsInner"></div>
    </div>

    <div class="toast" id="toast"><i class="fas fa-check"></i><span id="toastText"></span></div>

    <script>
        const QUESTIONS = [
            {"en": "In a certain code language, 'FLUTE' is written as 'VGFOU' and 'EXILE' is written as 'VORCV'. How will 'BLOOD' be written in that language?", "hi": "एक निश्चित कूट भाषा में, 'FLUTE' को 'VGFOU' के रूप में लिखा जाता है और 'EXILE' को 'VORCV' के रूप में लिखा जाता है। उस भाषा में 'BLOOD' कैसे लिखा जाएगा?", "opts": ["WLOXY", "WLLOB", "WLLOY", "WLLDB"], "ans": 2},
            {"en": "In a certain code language, ‘WHITE’ is written as ‘FSJGX’ and 'COLOR' is written as 'SNMND'. How will ‘SHIRT’ be written as in that language?", "hi": "एक निश्चित कूट भाषा में, 'WHITE' को 'FSJGX' के रूप में लिखा जाता है और 'COLOR' को 'SNMND' के रूप में लिखा जाता है। उस भाषा में 'SHIRT' को कैसे लिखा जाएगा?", "opts": ["TGJQU", "UQJIT", "UQJGT", "UPJGT"], "ans": 2},
            {"en": "In a certain code language, TRUST is written as UTXWY and GROUP is written as HTRYU. How will VISIT be written in that language?", "hi": "एक निश्चित कूट भाषा में, TRUST को UTXWY के रूप में लिखा जाता है और GROUP को HTRYU के रूप में लिखा जाता है। उस भाषा में VISIT को कैसे लिखा जाएगा?", "opts": ["WLUNY", "XKUNY", "WKUNZ", "WKVMY"], "ans": 3},

            {"en": "In a code language, 'TRUST' is written as 'UQVRU' and 'FAITH' is written as 'GZJSI'. How will 'LOVELY' be written in that language?", "hi": "एक कूट भाषा में, 'TRUST' को 'UQVRU' लिखा जाता है और 'FAITH' को 'GZJSI' लिखा जाता है। इस भाषा में 'LOVELY' कैसे लिखा जाएगा?", "opts": ["MNWDMX", "MNWDMZ", "KPUFKZ", "MPUFKX"], "ans": 0},

            {"en": "In a certain code language, ‘DWELL’ is written as ‘UBTMM’ and ‘OVER’ is written as ‘JCTG’. How will ‘DYAD’ be written in that language?", "hi": "एक निश्चित कूट भाषा में, ‘DWELL’ को ‘UBTMM’ के रूप में लिखा जाता है और ‘OVER’ को ‘JCTG’ के रूप में लिखा जाता है। उस भाषा में ‘DYAD’ कैसे लिखा जाएगा?", "opts": ["XUZU", "UXZU", "UZXU", "ZUXU"], "ans": 2},
            {"en": "In a certain code language 'WHEAT' is written as 'AMIFX' and 'BLACK' is written as 'FQEHO'. How will 'GREASE' be written in the same code language?", "hi": "एक निश्चित कोड भाषा में 'WHEAT' को 'AMIFX' और 'BLACK' को 'FQEHO' लिखा जाता है। उसी कोड भाषा में 'GREASE' को किस प्रकार लिखा जाएगा?", "opts": ["KWIGWI", "KWIFWJ", "KWIFVJ", "KWIFWI"], "ans": 1},
            {"en": "In a certain code language,'BLOOD' is written as 'CNRSI' and 'VEINS' is written as 'WGLRX'. How will 'HEART' be written in that language?", "hi": "एक निश्चित कोड भाषा में, 'BLOOD' को 'CNRSI' और 'VEINS' को 'WGLRX' लिखा जाता है। उस भाषा में 'HEART' को कैसे लिखा जाएगा?", "opts": ["IGDVY", "IGVDY", "IGDYV", "IGYDV"], "ans": 0},
            {"en": "In a certain code language, HONEY is coded as SLMVB and PRESIDENT is coded as KIVHRWVMG. What is the code for SPIDER?", "hi": "एक निश्चित कूट भाषा में, HONEY को SLMVB के रूप में कूटबद्ध किया जाता है और PRESIDENT को KIVHRWVMG के रूप में कूटबद्ध किया जाता है। SPIDER के लिए कूट क्या है?", "opts": ["TQJEFS", "URKFGT", "HKRWVI", "REDIPS"], "ans": 2},
            {"en": "In a certain code language, FROM is coded as 8 and BITTERNESS is coded as 20. What is the code for CAULIFLOWER?", "hi": "एक निश्चित कूट भाषा में, FROM को 8 के रूप में कूटबद्ध किया जाता है और BITTERNESS को 20 के रूप में कूटबद्ध किया जाता है। CAULIFLOWER के लिए कूट क्या है?", "opts": ["11", "12", "22", "10"], "ans": 2},
            {"en": "In a certain code language, 'RULE' is written as 'VXNF' and 'LEAD' is written as 'PHCE'. How will 'HERO' be written in that language?", "hi": "एक निश्चित कूट भाषा में, 'RULE' को 'VXNF' के रूप में लिखा जाता है और 'LEAD' को 'PHCE' के रूप में लिखा जाता है। उस भाषा में 'HERO' को कैसे लिखा जाएगा?", "opts": ["MITP", "MHUP", "LHTP", "LHUQ"], "ans": 2},
            {"en": "In a certain code language, ‘CURVED’ is coded as ‘FWSUCA’ and ‘LONDON’ is coded as ‘OQOCMK’. How will ‘SIMPLE’ be coded in the same language?", "hi": "एक निश्चित कूट भाषा में, ‘CURVED’ को ‘FWSUCA’ के रूप में कुटित किया जाता है और ‘LONDON’ को ‘OQOCMK’ के रूप में कुटित किया जाता है। इसी भाषा में ‘SIMPLE’ को कैसे कुटित किया जाएगा?", "opts": ["VKNOJB", "VKNPJC", "WLMOKB", "WLNPJD"], "ans": 0},
            {"en": "In a certain code, the word COMPAQ is written as DQNRBS and SONY is written as TQOA. In the same code, how is MOTOROLA written?", "hi": "एक निश्चित कूट में, COMPAQ शब्द को DQNRBS के रूप में लिखा जाता है और SONY को TQOA के रूप में लिखा जाता है। उसी कूट भाषा में MOTOROLA को कैसे लिखा जाता है?", "opts": ["NPUPSPMB", "INUNSNMB", "NQUQSQMC", "OPUPUPIB"], "ans": 2},
            {"en": "In a code language, 'SLAIN' is written as ‘PKCNU’ and 'DENT' is written as 'VPGF'. How will 'CUBOID' be written in that language?", "hi": "एक कूट भाषा में 'SLAIN' को 'PKCNU' और 'DENT' को 'VPGF' लिखा जाता है। उस भाषा में 'CUBOID' कैसे लिखा जाएगा?", "opts": ["FKQDWE", "FJQDWE", "FKQDVF", "EWDPKE"], "ans": 0},
            {"en": "If in a code language, MOBILITY is written as NPCJMJUZ, how is EXAMPLE written in that code?", "hi": "यदि किसी कूट भाषा में MOBILITY को NPCJMJUZ लिखा जाता है, तो उसी कूट भाषा में EXAMPLE को किस प्रकार लिखा जाएगा?", "opts": ["FYBNQMF", "EYBNQMF", "FYBNRME", "FZBNQMF"], "ans": 0},
            {"en": "If \"CANADA\" is written as \"ADANAC\", what is \"MEXICO\" written as?", "hi": "यदि \"CANADA\" को \"ADANAC\" के रूप में लिखा जाता है, तो \"MEXICO\" को किस प्रकार लिखा जाएगा?", "opts": ["OCIXME", "OCIXEM", "OCXEIM", "OCMXIE"], "ans": 1},
            {"en": "If in a certain code, ALMIRAH is written as BNPMWGO, which word would be written as DNRWLUA?", "hi": "यदि एक निश्चित कूट में, ALMIRAH को BNPMWGO के रूप में लिखा जाता है, तो किस शब्द को DNRWLUA लिखा जाएगा?", "opts": ["TOGSOLC", "CLOSGOT", "COSGOLT", "TOGCLOS"], "ans": 1},
            {"en": "If FRIEND is coded as HUMJTK, how is CANDLE written in that code?", "hi": "यदि FRIEND को HUMJTK के रूप में कोडित किया जाता है, तो उसी कोड में CANDLE को कैसे लिखा जाएगा?", "opts": ["EDOFMG", "EDRIRL", "DCPEMG", "DCQFME"], "ans": 1}
        ];

        const state = {
            current: 0,
            answers: new Array(QUESTIONS.length).fill(null),
            locked: new Array(QUESTIONS.length).fill(false),
            visited: new Array(QUESTIONS.length).fill(false),
            lang: 'en',
            mode: 'test',
            startTime: null,
            timerInterval: null,
            elapsed: 0
        };

        function $(id) { return document.getElementById(id); }
        function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

        function toast(msg) {
            const t = $('toast');
            $('toastText').textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
        }

        function startApp(mode) {
            state.mode = mode;
            $('startScreen').classList.add('hidden');
            $('quizApp').classList.remove('hidden');
            state.startTime = Date.now();
            state.visited[0] = true;
            state.timerInterval = setInterval(() => {
                state.elapsed = Math.floor((Date.now() - state.startTime) / 1000);
                $('timerText').textContent = formatTime(state.elapsed);
            }, 1000);
            renderQuestion();
            buildPalette();
        }

        function renderQuestion() {
            const i = state.current;
            const q = QUESTIONS[i];
            const qText = state.lang === 'en' ? q.en : q.hi;
            const isQuiz = state.mode === 'quiz';
            const locked = state.locked[i];
            const userAns = state.answers[i];

            let optsHtml = '';
            q.opts.forEach((opt, idx) => {
                let cls = '';
                let tag = '';
                if (isQuiz && locked) {
                    if (idx === q.ans) { cls = 'correct'; tag = '<span class="opt-tag">Correct</span>'; }
                    if (userAns === idx && idx !== q.ans) { cls = 'wrong'; tag = '<span class="opt-tag">Your Ans</span>'; }
                } else if (userAns === idx) {
                    cls = 'selected';
                }
                optsHtml += `
                    <div class="opt ${cls} ${locked ? 'locked' : ''}" onclick="selectOption(${idx})">
                        <div class="opt-letter">${String.fromCharCode(65 + idx)}</div>
                        <div class="opt-text">${esc(opt)}</div>
                        ${tag}
                    </div>
                `;
            });

            let solHtml = '';
            if (isQuiz && locked) {
                solHtml = `
                    <div class="sol-box">
                        <div class="sol-head"><i class="fas fa-lightbulb"></i> Answer Key</div>
                        <div class="sol-content">Correct Option: <strong>${String.fromCharCode(65 + q.ans)} (${esc(q.opts[q.ans])})</strong></div>
                    </div>
                `;
            }

            $('quizMain').innerHTML = `
                <div class="q-card">
                    <div class="q-top">
                        <div class="q-num-badge"><i class="fas fa-hashtag"></i> Question ${i + 1} of ${QUESTIONS.length}</div>
                        <button class="lang-btn" onclick="toggleLang()"><i class="fas fa-language"></i> ${state.lang === 'en' ? 'हिन्दी' : 'English'}</button>
                    </div>
                    <div class="q-text">${esc(qText)}</div>
                    <div class="opts">${optsHtml}</div>
                    ${solHtml}
                </div>
            `;

            $('prevBtn').disabled = i === 0;
            $('nextLabel').textContent = i === QUESTIONS.length - 1 ? 'Finish' : 'Next';
            updatePaletteGrid();
        }

        function selectOption(idx) {
            const i = state.current;
            if (state.mode === 'quiz' && state.locked[i]) return;

            state.answers[i] = idx;
            if (state.mode === 'quiz') {
                state.locked[i] = true;
                if (idx === QUESTIONS[i].ans) toast('Correct! 🎉');
                else toast('Incorrect');
            }
            renderQuestion();
        }

        function toggleLang() {
            state.lang = state.lang === 'en' ? 'hi' : 'en';
            renderQuestion();
        }

        function prevQuestion() {
            if (state.current > 0) {
                state.current--;
                state.visited[state.current] = true;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (state.current < QUESTIONS.length - 1) {
                state.current++;
                state.visited[state.current] = true;
                renderQuestion();
            } else {
                openSubmitModal();
            }
        }

        function buildPalette() {
            const grid = $('paletteGrid');
            grid.innerHTML = '';
            QUESTIONS.forEach((_, i) => {
                const btn = document.createElement('button');
                btn.className = 'pal-btn';
                btn.id = 'pal-' + i;
                btn.textContent = i + 1;
                btn.onclick = () => {
                    state.current = i;
                    state.visited[i] = true;
                    closePalette();
                    renderQuestion();
                };
                grid.appendChild(btn);
            });
            updatePaletteGrid();
        }

        function updatePaletteGrid() {
            QUESTIONS.forEach((_, i) => {
                const btn = $('pal-' + i);
                if (!btn) return;
                btn.className = 'pal-btn';
                if (i === state.current) btn.classList.add('current');
                if (state.answers[i] !== null) btn.classList.add('answered');
            });
        }

        function openPalette() {
            $('paletteDrawer').classList.add('open');$('paletteOverlay').classList.add('open');
        }
        function closePalette() {
            $('paletteDrawer').classList.remove('open');$('paletteOverlay').classList.remove('open');
        }

        function openSubmitModal() {
            const ans = state.answers.filter(a => a !== null).length;
            $('modalAttempted').textContent = ans;
            $('modalUnattempted').textContent = QUESTIONS.length - ans;
            $('submitModal').classList.add('open');
        }
        function closeSubmitModal() {
            $('submitModal').classList.remove('open');
        }

        function confirmSubmit() {
            closeSubmitModal();
            if (state.timerInterval) clearInterval(state.timerInterval);

            let correct = 0, wrong = 0;
            state.answers.forEach((ans, i) => {
                if (ans !== null) {
                    if (ans === QUESTIONS[i].ans) correct++;
                    else wrong++;
                }
            });

            const attempted = correct + wrong;
            const accuracy = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;

            $('resultsInner').innerHTML = `
                <div class="res-hero">
                    <h2>Test Completed!</h2>
                    <p style="color:var(--text-muted);font-size:14px;margin-top:2px;">Total Time: ${formatTime(state.elapsed)}</p>
                </div>
                <div class="res-score-card">
                    <div class="res-score-val">${correct} <span>/ ${QUESTIONS.length}</span></div>
                    <div class="res-score-lbl">Total Score</div>
                </div>
                <div class="res-grid">
                    <div class="res-item">
                        <div class="res-item-val" style="color:var(--green)">${correct}</div>
                        <div class="res-item-lbl">Correct</div>
                    </div>
                    <div class="res-item">
                        <div class="res-item-val" style="color:var(--red)">${wrong}</div>
                        <div class="res-item-lbl">Wrong</div>
                    </div>
                    <div class="res-item">
                        <div class="res-item-val">${attempted}</div>
                        <div class="res-item-lbl">Attempted</div>
                    </div>
                    <div class="res-item">
                        <div class="res-item-val" style="color:var(--primary)">${accuracy}%</div>
                        <div class="res-item-lbl">Accuracy</div>
                    </div>
                </div>
                <div class="res-actions">
                    <button class="res-btn primary" onclick="location.reload()"><i class="fas fa-redo"></i> Retake Test</button>
                </div>
            `;
            $('resultsScreen').classList.add('open');
        }
    </script>
</body>
</html>
